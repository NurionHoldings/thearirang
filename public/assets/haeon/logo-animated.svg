<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-labelledby="title desc"><title id="title">해온 요양원</title><desc id="desc">밝은 햇살과 따뜻한 온기를 품는 곳. 떠오르는 햇살을 두 팔이 감싸는 상징.</desc><defs><radialGradient id="halo"><stop stop-color="#f4c969" stop-opacity=".4"/><stop offset="1" stop-color="#f4c969" stop-opacity="0"/></radialGradient><linearGradient id="sun" x2="0" y2="1"><stop stop-color="#f4cc70"/><stop offset="1" stop-color="#e5a641"/></linearGradient><linearGradient id="leaf"><stop stop-color="#9ba98a"/><stop offset="1" stop-color="#6a815e"/></linearGradient></defs><style>.halo{transform-origin:320px 170px;animation:warmth 7s ease-in-out infinite}.sun{animation:rise 2.2s cubic-bezier(.16,1,.3,1) both}.arms{animation:embrace 2.6s ease-out both;transform-origin:320px 300px}.rays{transform-origin:320px 170px;animation:light 7s ease-in-out infinite}.word{animation:appear 2s .5s both}.glimmer{animation:drift 8s ease-in-out infinite}.two{animation-delay:3s}@keyframes rise{from{transform:translateY(45px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes embrace{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}@keyframes warmth{50%{opacity:.55;transform:scale(1.14)}}@keyframes light{50%{opacity:.55;transform:scale(1.035)}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes drift{0%,100%{opacity:.15;transform:translateY(10px)}50%{opacity:.65;transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle class="halo" cx="320" cy="170" r="170" fill="url(#halo)"/><g class="rays" stroke="#eab34d" stroke-width="8" stroke-linecap="round"><path d="M320 28v30M245 45l12 27M184 91l23 20M151 153l29 10M395 45l-12 27M456 91l-23 20M489 153l-29 10"/></g><g class="sun"><path d="M237 190a84 84 0 1 1 166 0l-83 67z" fill="url(#sun)"/></g><g class="arms" fill="url(#leaf)"><path d="M156 150c-13 68 47 90 105 117 34 16 50 37 57 65-1-76-47-103-99-124-35-15-58-27-63-58z"/><path d="M484 150c13 68-47 90-105 117-34 16-50 37-57 65 1-76 47-103 99-124 35-15 58-27 63-58z"/></g><g fill="#efbc5b"><circle class="glimmer" cx="192" cy="235" r="3"/><circle class="glimmer two" cx="448" cy="242" r="3"/></g><g class="word" text-anchor="middle" fill="#334d3c" font-family="'Noto Sans KR','Malgun Gothic',sans-serif"><text x="320" y="414" font-size="86" font-weight="600" letter-spacing="16">해온</text><text x="320" y="453" font-size="24" letter-spacing="8">요양원</text><path d="M283 475h74" stroke="#8c9a7b" stroke-width="2"/><text x="320" y="510" font-size="18" letter-spacing="1">밝은 햇살과 따뜻한 온기를 품는 곳</text></g></svg>
