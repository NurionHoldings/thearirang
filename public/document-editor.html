<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>전자문서 작성 | 더아리랑</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="document-editor.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"></head><body><header class="editor-header"><a href="/">더아리랑</a><span>전자문서 작성</span><a class="home-link" href="/">홈으로</a></header><main><section id="auth-gate" class="card"><h1>관리자 전자문서</h1><p id="gate-status" role="status">관리자 권한을 확인하고 있습니다.</p><a href="/admin.html">층별 관리자 로그인</a> · <a href="/?owner=1">총괄관리자 로그인</a></section><div id="document-workspace" hidden><aside class="card editor-fields"><div class="heading"><h1>전자문서 작성하기</h1><span id="workspace-label"></span></div><p class="hint">더아리랑 서식으로 작성하고 문서함에 비공개로 저장합니다.</p><label>저장된 문서<select id="saved-documents"><option value="">문서를 선택하세요</option></select></label><div class="row"><button type="button" id="open-document">선택 문서 열기</button><button type="button" id="refresh-list">목록 새로고침</button></div><label>문서 제목<input id="title" maxlength="200" placeholder="예: 개점 준비 공사 협조 요청"></label><div class="row"><label>수신<input id="recipient" maxlength="200" placeholder="수신인"></label><label>발신<input id="sender" maxlength="200" value="더아리랑"></label></div><label>작성일<input id="date" type="date"></label><label>본문<textarea id="content" maxlength="60000" rows="13" placeholder="내용을 입력하면 A4 페이지가 자동으로 추가됩니다."></textarea></label><div class="row"><label>본문 크기<select id="fontSize"><option>10</option><option selected>11</option><option>12</option><option>13</option></select></label><label>회사 서식<select id="background"><option value="yes">포함</option><option value="no">제외</option></select></label></div><p id="save-status" role="status" aria-live="polite">새 문서 · 아직 저장하지 않았습니다.</p><div class="row"><button id="save-document" class="primary" type="button">문서함에 저장</button><button id="save-copy" type="button">새 문서로 저장</button></div><div class="row"><button id="download-pdf" class="primary" type="button">PDF 다운로드</button><button id="print-document" type="button">인쇄</button></div><div class="row"><button id="export-document" type="button">작성 파일 다운로드</button><button id="import-document" type="button">작성 파일 불러오기</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><button id="new-document" class="quiet" type="button">새 문서 작성</button><p class="hint">문서함 저장은 서버에 보관됩니다. 작성 파일은 수정 가능한 JSON 백업이며 다른 PC에서도 불러올 수 있습니다. 저장 전 이동하면 변경 내용이 사라질 수 있습니다.</p></aside><section class="preview" aria-label="문서 미리보기"><div class="preview-toolbar"><strong>A4 미리보기</strong><span id="page-count" role="status"></span></div><div id="pages"></div></section></div></main><script type="module" src="document-editor.js"></script></body></html>
