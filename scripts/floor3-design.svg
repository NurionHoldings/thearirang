ss="small">중앙 복도 2.4m·생활 복도 1.8m는 설계 목표 / 실제 피난·편의시설 기준과 침상 회전 검증 필요</text><text x="45" y="1130" class="small">공간 관계를 구분한 설계 브리프입니다. 이 도형의 폭·길이를 실제 실 치수로 사용하지 마십시오.</text></svg>